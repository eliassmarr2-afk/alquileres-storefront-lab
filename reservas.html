<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Reservas activas · Zekere Juegos</title>
  <meta name="description" content="Revisá y administrá tus reservas activas en Zekere Juegos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/juegos.css">
  <link rel="stylesheet" href="assets/css/reservations.css">
  <link rel="stylesheet" href="assets/css/reservas.css">
</head>
<body class="home-page reservations-page">
  <header class="google-header" aria-label="Encabezado principal">
    <a class="zekere-symbol" href="index.html" aria-label="Zekere Juegos, inicio"><span>Z</span></a>
    <button class="search-pill" type="button" aria-label="Buscar juegos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <span>Buscar juegos</span>
    </button>
    <div class="header-tools" aria-label="Acciones rápidas">
      <button class="icon-button" type="button" aria-label="Cambiar apariencia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.6 8.6 0 1 0 20.5 14.3Z"></path></svg>
      </button>
      <button class="icon-button zekere-reservation-trigger" type="button" aria-label="Seleccionar fecha del evento" data-reservation-calendar-trigger>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2.5"></rect><path d="M8 3v5M16 3v5M4 10h16"></path></svg>
      </button>
    </div>
  </header>

  <main class="reservations-main">
    <section class="reservations-intro" aria-labelledby="reservations-title">
      <div class="pink-hook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"></path></svg>
        <span>Diversión que se recuerda</span>
      </div>
      <h1 id="reservations-title">Tus reservas <span>activas.</span></h1>
      <p data-reservations-date-copy>Revisá los juegos que elegiste para tu evento.</p>
    </section>

    <section class="reservations-list games-grid" data-reservations-list aria-live="polite"></section>

    <section class="reservations-empty" data-reservations-empty hidden>
      <span class="reservations-empty__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="2.5"></rect><path d="M8 3v5M16 3v5M4 10h16"></path></svg>
      </span>
      <h2>No tenés reservas activas</h2>
      <p>Elegí un juego y seleccioná la fecha del evento para comenzar.</p>
      <a href="juegos.html">Ver juegos</a>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Explorar Zekere">
    <a class="bottom-nav__item" href="index.html#pack"><span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M12 8v12M4 12h16M8.5 8C7 8 6 7.2 6 6s1-2 2.3-2C10 4 12 8 12 8M15.5 8C17 8 18 7.2 18 6s-1-2-2.3-2C14 4 12 8 12 8"></path></svg></span><span>Combos</span></a>
    <a class="bottom-nav__item" href="index.html"><span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5"></path><path d="M5.5 9.5V21h13V9.5M9.5 21v-6h5v6"></path></svg></span><span>Home</span></a>
    <a class="bottom-nav__item" href="zonas.html"><span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></span><span>Zonas</span></a>
    <a class="bottom-nav__item" href="juegos.html"><span class="bottom-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V9.5L12 5l8 4.5V19"></path><path d="M8 19v-5h8v5M9 10h6"></path></svg></span><span>Juegos</span></a>
  </nav>

  <script src="assets/js/reservations.js"></script>
  <script src="assets/js/reservas-page.js"></script>
</body>
</html>
